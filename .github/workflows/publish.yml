name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Build + twine upload. The build step runs unconditionally so the
# workflow can be validated on a tag push even before PyPI is wired; the
# upload step is gated on PYPI_TOKEN being set.
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: pip install --upgrade build twine
      - run: python -m build
      - name: Upload to PyPI
        if: env.PYPI_TOKEN != ''
        run: twine upload --non-interactive dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      - name: Skip publish (no PYPI_TOKEN secret)
        if: env.PYPI_TOKEN == ''
        run: |
          echo "::notice::PYPI_TOKEN secret is not set; skipping publish step."
          echo "Set PYPI_TOKEN in Settings → Secrets → Actions, then re-tag to release."
