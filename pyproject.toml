[project]
name = "authio"
version = "0.1.0"
description = "Authio Python SDK — passwordless, multi-org auth for B2B apps."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Authio" }]
keywords = ["authentication", "passkey", "webauthn", "saml", "scim", "sso", "magic-link"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://authio.com"
Source = "https://github.com/tcast/authio_python"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
